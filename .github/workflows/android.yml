name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer l'application web
        run: |
          node build.mjs
          npx cap sync android

      - name: Compiler l'APK signé
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          VERSION=$(grep -m1 versionName android/app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/release/app-release.apk "Reglements-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Reglements-apk
          path: Reglements-*.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Règlements ${{ env.VERSION }} (build ${{ github.run_number }})
          body: APK à installer sur Android. Téléchargez le fichier .apk ci-dessous depuis votre téléphone.
          files: Reglements-*.apk
